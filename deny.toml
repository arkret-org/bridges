# cargo-deny configuration. Run `cargo deny check` locally; mirrors the
# supply-chain expectations shared with the sibling cokret repositories.

[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "aarch64-apple-darwin" },
]

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Apache-2.0 + permissive licenses we already depend on. Add to this list only
# after a manual review.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "0BSD",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  "Unlicense",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
name = "ring"
allow = ["OpenSSL", "ISC", "MIT"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
