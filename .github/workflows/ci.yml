name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bridges
        uses: actions/checkout@v6

      - name: Check spelling
        uses: crate-ci/typos@v1.45.2

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bridges
        uses: actions/checkout@v6
        with:
          path: bridges

      # The workspace depends on the arkret SDK via a `../arkret-rust-sdk`
      # path dependency, so the SDK must be checked out as a sibling.
      - name: Checkout Arkret Rust SDK
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridges -> target

      # ARC-0002 (重构计划 2026-07-10): legacy patterns must stay at zero.
      - name: Deletion gate
        run: bash scripts/deletion_gate.sh
        working-directory: bridges

      - name: Rustfmt
        run: cargo +nightly fmt --all -- --check
        working-directory: bridges

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: bridges

      - name: Test
        run: cargo test --workspace --locked
        working-directory: bridges

  supply-chain:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bridges
        uses: actions/checkout@v6
        with:
          path: bridges

      - name: Checkout Arkret Rust SDK
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Cargo deny
        run: cargo deny check
        working-directory: bridges

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bridges
        uses: actions/checkout@v6
        with:
          path: bridges

      - name: Checkout Arkret Rust SDK
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@1.98

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridges -> target

      - name: Check MSRV
        run: cargo check --workspace --all-targets --locked
        working-directory: bridges
