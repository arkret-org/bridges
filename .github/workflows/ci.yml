name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bridges
        uses: actions/checkout@v6

      - name: Check spelling
        uses: crate-ci/typos@v1.45.2

  rust:
    name: Rust (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: sqlite
            cargo-features: ''
          - backend: postgres
            cargo-features: --no-default-features --features postgres
    services:
      postgres:
        image: ${{ matrix.backend == 'postgres' && 'postgres:18' || '' }}
        env:
          POSTGRES_USER: bridges
          POSTGRES_PASSWORD: bridges
          POSTGRES_DB: bridges_test
          POSTGRES_INITDB_ARGS: --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridges -d bridges_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout bridges
        uses: actions/checkout@v6
        with:
          path: bridges

      # The workspace depends on the arkret SDK via a `../arkret-rust-sdk`
      # path dependency, so the SDK must be checked out as a sibling.
      - name: Checkout Arkret Rust SDK
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout Garth
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly rustfmt
        if: matrix.backend == 'sqlite'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      # Discord/Telegram use native TLS; PostgreSQL-only also links libpq.
      # SQLite is bundled by the runtime's default feature.
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends pkg-config libssl-dev libpq-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridges -> target
          key: ${{ matrix.backend }}

      # ARC-0002 (重构计划 2026-07-10): legacy patterns must stay at zero.
      - name: Deletion gate
        if: matrix.backend == 'sqlite'
        run: bash scripts/deletion_gate.sh
        working-directory: bridges

      - name: Rustfmt
        if: matrix.backend == 'sqlite'
        run: cargo +nightly fmt --all -- --check
        working-directory: bridges

      - name: Clippy
        run: cargo +stable clippy --workspace --all-targets --locked ${{ matrix.cargo-features }} -- -D warnings
        working-directory: bridges

      - name: Test
        run: cargo +stable test --workspace --locked ${{ matrix.cargo-features }}
        env:
          BRIDGES_TEST_DATABASE_URL: ${{ matrix.backend == 'postgres' && 'postgres://bridges:bridges@127.0.0.1:5432/bridges_test' || '' }}
        working-directory: bridges

  supply-chain:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bridges
        uses: actions/checkout@v6
        with:
          path: bridges

      - name: Checkout Arkret Rust SDK
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout Garth
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Cargo deny
        run: cargo deny check
        working-directory: bridges

  msrv:
    name: MSRV (default SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bridges
        uses: actions/checkout@v6
        with:
          path: bridges

      - name: Checkout Arkret Rust SDK
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout Garth
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@1.98

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends pkg-config libssl-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridges -> target

      - name: Check MSRV
        run: cargo check --workspace --all-targets --locked
        working-directory: bridges

      - name: Check embedded web without standalone runtime
        run: cargo check -p arkret-bridge-runtime --all-targets --no-default-features --features managed-authoring,web --locked
        env:
          RUSTFLAGS: -D warnings
        working-directory: bridges
