[package]
name = "arkret-bridge-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Applet bridge runtime for Arkret integrations: protocol-side event submission, applet routes, database pool, configuration, salvo web, queue/cache, and logging."

# This feature-only dependency selects bundled SQLite and has no direct Rust
# symbol references for cargo-machete to discover.
[package.metadata.cargo-machete]
ignored = ["libsqlite3-sys"]

[features]
default  = ["full", "sqlite"]
full     = ["db", "web", "runtime", "managed-authoring"]
# Intentionally empty and intentionally kept: `edge` names the always-available
# protocol-edge surface (ArkretEdge / AuthoringStore / AuthoringJournal / Config / errors /
# cache / queue), which is what is left when no other feature is on. It enables
# nothing because that surface is unconditional — see the crate-level docs in
# src/lib.rs. It is not a dangling feature: the out-of-repo consumer
# ../../../savfox-ai/savfox/Cargo.toml depends on this crate with
# `default-features = false, features = ["edge"]`, so removing the name breaks
# that manifest with "feature `edge` does not exist". The same consumer also
# calls symbols on this surface (e.g. `ArkretEdge::new_outbound`), so check
# ../../../savfox-ai/savfox before deleting any shared-layer pub symbol.
edge     = []
managed-authoring = [ "dep:chacha20poly1305", "dep:getrandom"]
db       = ["dep:diesel", "dep:diesel_migrations"]
sqlite   = ["db", "diesel/sqlite", "dep:libsqlite3-sys"]
postgres = ["db", "diesel/postgres"]
web      = ["dep:metrics", "dep:metrics-exporter-prometheus", "dep:salvo"]
runtime  = ["db", "web"]

[dependencies]
anyhow = { workspace = true }
arkret = { workspace = true }
arkret-canonical = { workspace = true }
arkret-event-draft = { workspace = true }
arkret-identifiers = { workspace = true }
arkret-models-collaboration = { workspace = true }
arkret-models-discovery = { workspace = true }
arkret-models-integration = { workspace = true }
arkret-retry = { workspace = true }
arkret-signatures = { workspace = true }
arkret-wire = { workspace = true }
async-trait = { workspace = true }
chacha20poly1305 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
chrono = { workspace = true }
diesel = { workspace = true, optional = true }
diesel_migrations = { workspace = true, optional = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
libsqlite3-sys = { workspace = true, features = ["bundled"], optional = true }
metrics = { workspace = true, optional = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
redb = "4.2.0"
rustls = { workspace = true }
salvo = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[dev-dependencies]
arkret-test-kit = { version = "0.3.0", path = "../../../arkret-rust-sdk/crates/test-kit" }
arkret-wire = { workspace = true, features = ["test-support"] }
rand_chacha = { workspace = true }
# `test` adds salvo's in-process `TestClient`, used by the web.rs admin-plane
# trigger-path tests. Dev-only: production builds keep the lean feature set.
salvo = { workspace = true, features = ["test"] }

[lints]
workspace = true
