[package]
name = "cokret-bridge-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Applet bridge runtime for Cokret integrations: protocol-side event submission, applet routes, database pool, configuration, salvo web, queue/cache, and logging."

[features]
default  = ["full", "sqlite"]
full     = ["db", "web", "runtime"]
edge     = []
db       = ["dep:diesel"]
sqlite   = ["db", "diesel/sqlite", "dep:libsqlite3-sys"]
postgres = ["db", "diesel/postgres"]
mysql    = ["db", "diesel/mysql"]
web      = ["dep:salvo"]
runtime  = ["db", "web"]

[dependencies]
anyhow = {workspace = true}
async-trait = {workspace = true}
chrono = {workspace = true}
cokret = {workspace = true}
diesel = {workspace = true,optional = true}
libsqlite3-sys = {workspace = true,features = ["bundled"],optional = true}
parking_lot = {workspace = true}
reqwest = {workspace = true}
salvo = {workspace = true,optional = true}
serde = {workspace = true}
serde_json = {workspace = true}
serde_yaml = {workspace = true}
thiserror = {workspace = true}
tokio = {workspace = true}
tracing = {workspace = true}
tracing-subscriber = {workspace = true}
url = {workspace = true}
