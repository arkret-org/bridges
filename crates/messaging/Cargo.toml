[package]
name = "arkret-bridge-messaging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Messaging helper layer for Arkret Applet bridges: channel/user/message mappings, ak.message.create wiring, and social bridge adapter traits."

[features]
default = ["sqlite"]
sqlite = ["arkret-bridge-runtime/runtime", "arkret-bridge-runtime/managed-authoring", "arkret-bridge-runtime/sqlite"]
postgres = ["arkret-bridge-runtime/runtime", "arkret-bridge-runtime/managed-authoring", "arkret-bridge-runtime/postgres"]

[dependencies]
horme.workspace = true
aes = { workspace = true }
anyhow = { workspace = true }
arkret = { workspace = true }
arkret-bridge-runtime = { workspace = true, default-features = false }
arkret-egress-reqwest = { workspace = true }
arkret-event-draft = { workspace = true }
arkret-models-collaboration = { workspace = true }
arkret-models-integration = { workspace = true }
arkret-signatures = { workspace = true }
arkret-wire = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
cbc = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
diesel = { workspace = true }
diesel_migrations = { workspace = true }
ed25519-dalek = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
salvo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
