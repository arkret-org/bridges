[package]
name = "cokret-bridge-messaging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Messaging helper layer for Cokret Applet bridges: channel/user/message mappings, ck.message.create wiring, and social bridge adapter traits."

[features]
default = ["sqlite"]
sqlite = ["cokret-bridge-runtime/runtime", "cokret-bridge-runtime/sqlite"]
postgres = ["cokret-bridge-runtime/runtime", "cokret-bridge-runtime/postgres"]
mysql = ["cokret-bridge-runtime/runtime", "cokret-bridge-runtime/mysql"]

[dependencies]
anyhow = {workspace = true}
async-trait = {workspace = true}
base64 = {workspace = true}
chrono = {workspace = true}
clap = {workspace = true}
cokret = {workspace = true}
cokret-bridge-runtime = {workspace = true,default-features = false}
diesel = {workspace = true}
futures = {workspace = true}
hex = {workspace = true}
hmac = {workspace = true}
jsonwebtoken = {workspace = true}
reqwest = {workspace = true}
salvo = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
sha1 = {workspace = true}
sha2 = {workspace = true}
subtle = {workspace = true}
tokio = {workspace = true}
tracing = {workspace = true}
