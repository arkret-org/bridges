[package]
name = "arkret-bridge-messaging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Messaging helper layer for Arkret Applet bridges: channel/user/message mappings, ak.message.create wiring, and social bridge adapter traits."

[features]
default = ["sqlite"]
sqlite = ["arkret-bridge-runtime/runtime", "arkret-bridge-runtime/sqlite"]
postgres = ["arkret-bridge-runtime/runtime", "arkret-bridge-runtime/postgres"]
mysql = ["arkret-bridge-runtime/runtime", "arkret-bridge-runtime/mysql"]

[dependencies]
aes = {workspace = true}
anyhow = {workspace = true}
async-trait = {workspace = true}
base64 = {workspace = true}
cbc = {workspace = true}
chrono = {workspace = true}
clap = {workspace = true}
arkret = {workspace = true}
arkret-event-draft = {workspace = true}
arkret-models-collaboration = {workspace = true}
arkret-models-integration = {workspace = true}
arkret-bridge-runtime = {workspace = true,default-features = false}
diesel = {workspace = true}
diesel_migrations = {workspace = true}
futures = {workspace = true}
hex = {workspace = true}
hmac = {workspace = true}
jsonwebtoken = {workspace = true}
reqwest = {workspace = true}
salvo = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
sha1 = {workspace = true}
sha2 = {workspace = true}
subtle = {workspace = true}
tokio = {workspace = true}
tracing = {workspace = true}
