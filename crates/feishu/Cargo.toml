[package]
name = "arkret-bridge-feishu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "arkret <-> Feishu/Lark bridge (reqwest)."

[[bin]]
name = "arkret-bridge-feishu"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = ["arkret-bridge-messaging/sqlite"]
postgres = ["arkret-bridge-messaging/postgres"]

[dependencies]
anyhow = { workspace = true }
arkret-bridge-messaging = { workspace = true, default-features = false }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
aes = { workspace = true }
arkret-bridge-messaging = { workspace = true, default-features = false }
base64 = { workspace = true }
cbc = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
