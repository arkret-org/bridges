[package]
name = "cokret-bridge-feishu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "cokret <-> Feishu/Lark bridge (reqwest)."

[[bin]]
name = "cokret-bridge-feishu"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = ["cokret-bridge-runtime/sqlite", "cokret-bridge-messaging/sqlite"]
postgres = ["cokret-bridge-runtime/postgres", "cokret-bridge-messaging/postgres"]
mysql = ["cokret-bridge-runtime/mysql", "cokret-bridge-messaging/mysql"]

[dependencies]
anyhow = {workspace = true}
async-trait = {workspace = true}
cokret-bridge-messaging = {workspace = true,default-features = false}
cokret-bridge-runtime = {workspace = true,default-features = false}
serde = {workspace = true}
serde_json = {workspace = true}
tokio = {workspace = true}

[dev-dependencies]
aes = {workspace = true}
base64 = {workspace = true}
cbc = {workspace = true}
cokret-bridge-messaging = {workspace = true,default-features = false}
sha2 = {workspace = true}
