[package]
name = "arkret-bridge-imessage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "arkret <-> iMessage bridge (BlueBubbles/AirMessage HTTP gateway, reqwest)."

[[bin]]
name = "arkret-bridge-imessage"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = ["arkret-bridge-messaging/sqlite"]
postgres = ["arkret-bridge-messaging/postgres"]

[lints]
workspace = true

[dependencies]
anyhow = {workspace = true}
async-trait = {workspace = true}
arkret-bridge-messaging = {workspace = true,default-features = false}
serde = {workspace = true}
serde_json = {workspace = true}
tokio = {workspace = true}
