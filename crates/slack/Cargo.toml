[package]
name = "arkret-bridge-slack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "arkret <-> Slack bridge (socket mode + Web API)."

[[bin]]
name = "arkret-bridge-slack"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = ["arkret-bridge-messaging/sqlite"]
postgres = ["arkret-bridge-messaging/postgres"]
mysql = ["arkret-bridge-messaging/mysql"]

[lints]
workspace = true

[dependencies]
anyhow = {workspace = true}
async-trait = {workspace = true}
arkret-bridge-messaging = {workspace = true,default-features = false}
futures = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
tokio = {workspace = true}
tokio-tungstenite = {workspace = true,default-features = false,features = [
    "rustls-tls-webpki-roots",
    "connect",
]}
tracing = {workspace = true}
