[package]
name = "cokret-bridge-slack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "cokret <-> Slack bridge (socket mode + Web API)."

[[bin]]
name = "cokret-bridge-slack"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = ["cokret-bridge-runtime/sqlite", "cokret-bridge-messaging/sqlite"]
postgres = ["cokret-bridge-runtime/postgres", "cokret-bridge-messaging/postgres"]
mysql = ["cokret-bridge-runtime/mysql", "cokret-bridge-messaging/mysql"]

[dependencies]
anyhow = {workspace = true}
async-trait = {workspace = true}
clap = {workspace = true}
cokret-bridge-messaging = {workspace = true,default-features = false}
cokret-bridge-runtime = {workspace = true,default-features = false}
futures = {workspace = true}
reqwest = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
tokio = {workspace = true}
tokio-tungstenite = {workspace = true,default-features = false,features = [
    "rustls-tls-webpki-roots",
    "connect",
]}
tracing = {workspace = true}
