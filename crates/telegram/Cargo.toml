[package]
name = "cokret-bridge-telegram"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "cokret <-> Telegram bridge (teloxide long polling)."

[[bin]]
name = "cokret-bridge-telegram"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = ["cokret-bridge-messaging/sqlite"]
postgres = ["cokret-bridge-messaging/postgres"]
mysql = ["cokret-bridge-messaging/mysql"]

[dependencies]
anyhow = {workspace = true}
async-trait = {workspace = true}
cokret-bridge-messaging = {workspace = true,default-features = false}
serde = {workspace = true}
teloxide = {workspace = true,default-features = false,features = [
    "rustls",
    "ctrlc_handler",
]}
tokio = {workspace = true}
tracing = {workspace = true}
