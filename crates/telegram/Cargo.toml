[package]
name = "arkret-bridge-telegram"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "arkret <-> Telegram bridge (teloxide long polling)."

[[bin]]
name = "arkret-bridge-telegram"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = ["arkret-bridge-messaging/sqlite"]
postgres = ["arkret-bridge-messaging/postgres"]

[dependencies]
anyhow = { workspace = true }
arkret-bridge-messaging = { workspace = true, default-features = false }
async-trait = { workspace = true }
serde = { workspace = true }
teloxide-core = { workspace = true, default-features = false, features = ["rustls"] }
tokio = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
