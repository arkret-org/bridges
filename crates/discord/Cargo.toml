[package]
name = "cokret-bridge-discord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "cokret <-> Discord bridge (serenity gateway)."

[[bin]]
name = "cokret-bridge-discord"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = ["cokret-bridge-runtime/sqlite", "cokret-bridge-messaging/sqlite"]
postgres = ["cokret-bridge-runtime/postgres", "cokret-bridge-messaging/postgres"]
mysql = ["cokret-bridge-runtime/mysql", "cokret-bridge-messaging/mysql"]

[dependencies]
anyhow = {workspace = true}
async-trait = {workspace = true}
clap = {workspace = true}
cokret-bridge-messaging = {workspace = true,default-features = false}
cokret-bridge-runtime = {workspace = true,default-features = false}
serde = {workspace = true}
serde_json = {workspace = true}
serenity = {workspace = true,default-features = false,features = [
    "client",
    "gateway",
    "rustls_backend",
    "model",
    "cache",
]}
tokio = {workspace = true}
tracing = {workspace = true}
