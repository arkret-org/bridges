[package]
name = "arkret-bridge-discord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "arkret <-> Discord bridge (serenity gateway)."

[[bin]]
name = "arkret-bridge-discord"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = ["arkret-bridge-messaging/sqlite"]
postgres = ["arkret-bridge-messaging/postgres"]
mysql = ["arkret-bridge-messaging/mysql"]

[dependencies]
anyhow = {workspace = true}
async-trait = {workspace = true}
arkret-bridge-messaging = {workspace = true,default-features = false}
serde = {workspace = true}
serenity = {workspace = true,default-features = false,features = [
    "client",
    "gateway",
    "rustls_backend",
    "model",
    "cache",
]}
tokio = {workspace = true}
tracing = {workspace = true}
