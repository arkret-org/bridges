[package]
name = "arkret-bridge-wechat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "arkret <-> WeChat (WeChat Work / Official Account) bridge (reqwest)."

[[bin]]
name = "arkret-bridge-wechat"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = ["arkret-bridge-messaging/sqlite"]
postgres = ["arkret-bridge-messaging/postgres"]
mysql = ["arkret-bridge-messaging/mysql"]

[dependencies]
anyhow = {workspace = true}
async-trait = {workspace = true}
arkret-bridge-messaging = {workspace = true,default-features = false}
quick-xml = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
tokio = {workspace = true}
tracing = {workspace = true}

[dev-dependencies]
aes = {workspace = true}
base64 = {workspace = true}
cbc = {workspace = true}
