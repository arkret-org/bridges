[package]
name = "arkret-bridge-line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "arkret <-> LINE bridge (LINE Messaging API, reqwest HTTP)."

[[bin]]
name = "arkret-bridge-line"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = ["arkret-bridge-messaging/sqlite"]
postgres = ["arkret-bridge-messaging/postgres"]

[dependencies]
anyhow = { workspace = true }
arkret-bridge-messaging = { workspace = true, default-features = false }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
