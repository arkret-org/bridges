[package]
name = "arkret-bridge-dingtalk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "arkret <-> DingTalk bridge (reqwest HTTP)."

[[bin]]
name = "arkret-bridge-dingtalk"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = ["arkret-bridge-messaging/sqlite"]
postgres = ["arkret-bridge-messaging/postgres"]
mysql = ["arkret-bridge-messaging/mysql"]

[lints]
workspace = true

[dependencies]
anyhow = {workspace = true}
async-trait = {workspace = true}
arkret-bridge-messaging = {workspace = true,default-features = false}
serde = {workspace = true}
serde_json = {workspace = true}
tokio = {workspace = true}
