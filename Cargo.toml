[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
authors = ["Cokret Team <chris@acroidea.com>"]
license = "Apache-2.0"

[workspace.dependencies]
# Local cokret SDK (protocol side). Path is relative to the workspace root.
# Applet bridge runtime and chat/social helper layer.
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = {version = "0.4",features = ["serde"]}
clap = {version = "4.6",features = ["derive", "env"]}
cokret = {path = "../cokret-rust-sdk/crates/sdk",default-features = false,features = [
    "client",
    "salvo",
    "applet-runtime",
    "signer",
]}
cokret-bridge-messaging = {path = "crates/messaging",default-features = false}
cokret-bridge-runtime = {path = "crates/runtime",default-features = false}
config = "0.15"
diesel = {version = "2.3",default-features = false,features = ["r2d2", "chrono"]}
futures = "0.3"
hex = "0.4"
hmac = "0.13"
jsonwebtoken = "10.4"
kdl = "6"
libsqlite3-sys = "0.35"
once_cell = "1.21"
parking_lot = "0.12"
quick-xml = "0.40"
reqwest = {version = "0.13",default-features = false,features = ["form", "json", "rustls", "stream"]}
salvo = {version = "0.93.0",features = ["oapi", "affix-state"]}
serde = {version = "1.0",features = ["derive"]}
serde_json = "1.0"
serde_yaml = "0.9"
serenity = {version = "0.12",default-features = false}
sha1 = "0.11"
sha2 = "0.11"
subtle = "2.6"
teloxide = {version = "0.17",default-features = false}
thiserror = "2.0"
tokio = {version = "1.52",features = ["full"]}
tokio-tungstenite = {version = "0.29",default-features = false}
tracing = "0.1"
tracing-subscriber = {version = "0.3",features = ["env-filter", "json"]}
url = "2.5"
uuid = {version = "1.23",features = ["v4", "v7", "serde"]}


[profile.release]
lto = "thin"
codegen-units = 1
strip = true
