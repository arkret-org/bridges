[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
authors = ["Cokret Team <chris@acroidea.com>"]
license = "Apache-2.0"

[workspace.dependencies]
# Local cokret SDK (protocol side). Path is relative to the workspace root.
# Applet bridge runtime and chat/social helper layer.
aes = "0.8"
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
cbc = {version = "0.1",features = ["block-padding"]}
chrono = {version = "0.4",features = ["serde"]}
clap = {version = "4.6",features = ["string"]}
cokret = {path = "../cokret-rust-sdk/crates/sdk",default-features = false,features = [
    "client",
    "salvo",
    "applet-runtime",
    "signer",
]}
cokret-bridge-messaging = {path = "crates/messaging",default-features = false}
cokret-bridge-runtime = {path = "crates/runtime",default-features = false}
diesel = {version = "2.3",default-features = false,features = ["r2d2", "chrono"]}
diesel_migrations = "2.3"
futures = "0.3"
hex = "0.4"
hmac = "0.13"
jsonwebtoken = "10.4"
libsqlite3-sys = "0.35"
metrics = "0.24"
metrics-exporter-prometheus = {version = "0.18.3",default-features = false}
parking_lot = "0.12"
quick-xml = {version = "0.40",features = ["serialize"]}
reqwest = {version = "0.13",default-features = false,features = ["form", "json", "rustls", "stream"]}
salvo = {git = "https://github.com/salvo-rs/salvo.git",branch = "main",features = ["oapi", "affix-state", "rate-limiter"]}
serde = {version = "1.0",features = ["derive"]}
serde_json = "1.0"
serde_yaml_ng = "0.10.0"
serenity = {version = "0.12",default-features = false}
sha1 = "0.11"
sha2 = "0.11"
subtle = "2.6"
teloxide = {version = "0.17",default-features = false}
thiserror = "2.0"
tokio = {version = "1.52",features = ["full"]}
tokio-tungstenite = {version = "0.29",default-features = false}
tracing = "0.1"
tracing-subscriber = {version = "0.3",features = ["env-filter", "json"]}
url = "2.5"


[profile.release]
lto = "thin"
codegen-units = 1
strip = true
