[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
authors = ["Cokret Team <chris@acroidea.com>"]
license = "Apache-2.0"

[workspace.dependencies]
# Local cokret SDK (protocol side). Path is relative to the workspace root.
cokret = { path = "../../cokret/cokret-rust-sdk/crates/sdk", default-features = false, features = [
    "client",
    "salvo",
    "applet-runtime",
    "signer",
] }
# Applet bridge runtime and chat/social helper layer.
cokret-bridge-runtime = { path = "crates/runtime", default-features = false }
cokret-bridge-messaging = { path = "crates/messaging", default-features = false }

salvo = { version = "0.93.0", features = ["oapi", "affix-state"] }
tokio = { version = "1.48", features = ["full"] }
diesel = { version = "2.3", default-features = false, features = ["r2d2", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
config = "0.15"
kdl = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
url = "2.5"
parking_lot = "0.12"
clap = { version = "4.5", features = ["derive", "env"] }
once_cell = "1.20"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
subtle = "2.6"
hex = "0.4"
quick-xml = "0.38"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
