[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/messaging", "crates/runtime"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
authors = ["Arkret Team <chris@acroidea.com>"]
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
# Local arkret SDK (protocol side). Path is relative to the workspace root.
# Applet bridge runtime and chat/social helper layer.
aes = "0.9"
anyhow = "1.0"
arkret = { version = "0.3.0", path = "../arkret-rust-sdk/crates/sdk", default-features = false, features = [
    "client",
    "server",
    "signer",
] }
arkret-canonical = { version = "0.3.0", path = "../arkret-rust-sdk/crates/canonical", default-features = false }
arkret-bridge-messaging = { version = "0.3.0", path = "crates/messaging", default-features = false }
arkret-bridge-runtime = { version = "0.3.0", path = "crates/runtime", default-features = false }
arkret-egress-reqwest = { version = "0.3.0", path = "../arkret-rust-sdk/crates/egress-reqwest" }
arkret-event-draft = { version = "0.3.0", path = "../arkret-rust-sdk/crates/event-draft", default-features = false }
arkret-identifiers = { version = "0.3.0", path = "../arkret-rust-sdk/crates/identifiers", default-features = false }
arkret-models-collaboration = { version = "0.3.0", path = "../arkret-rust-sdk/crates/models-collaboration", default-features = false }
arkret-models-discovery = { version = "0.3.0", path = "../arkret-rust-sdk/crates/models-discovery", default-features = false }
arkret-models-integration = { version = "0.3.0", path = "../arkret-rust-sdk/crates/models-integration", default-features = false }
arkret-retry = { version = "0.3.0", path = "../arkret-rust-sdk/crates/retry", default-features = false }
arkret-signatures = { version = "0.3.0", path = "../arkret-rust-sdk/crates/signatures", default-features = false, features = ["signer"] }
arkret-wire = { version = "0.3.0", path = "../arkret-rust-sdk/crates/wire", default-features = false }
async-trait = "0.1"
base64 = "0.23"
cbc = { version = "0.2", features = ["block-padding"] }
chacha20poly1305 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["string"] }
diesel = { version = "2.3", default-features = false, features = ["r2d2", "chrono"] }
diesel_migrations = "2.3"
ed25519-dalek = "3.0"
futures = "0.3"
garth = { version = "0.3.0", path = "../garth", default-features = false }
getrandom = "0.4"
hex = "0.4"
hmac = "0.13"
jsonwebtoken = { version = "11.0", features = ["aws_lc_rs"] }
libsqlite3-sys = "0.38"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
parking_lot = "0.12"
quick-xml = { version = "0.42", features = ["serialize"] }
rand_chacha = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
salvo = { version = "=1.0.1", default-features = false, features = ["fix-http1-request-uri", "server", "server-handle", "http1", "http2", "oapi", "rfc9457", "affix-state", "rate-limiter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "1.2"
serenity = { version = "0.12", default-features = false }
sha1 = "0.11"
sha2 = "0.11"
subtle = "2.6"
teloxide-core = { version = "0.13", default-features = false }
thiserror = "2.0"
tokio = { version = "1.53", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
